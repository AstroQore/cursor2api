syntax = "proto3";

// Shim for google.protobuf.Value.
//
// Cursor's `McpArgs.args` is `map<string, bytes>` where each value is a
// serialized google.protobuf.Value. The vendored agent.proto (extracted from the
// wire descriptor) lost that type, so we decode the map values with this local
// copy: `1a 05 "Osaka"` -> string_value = "Osaka".
package shim;

enum NullValue {
  NULL_VALUE = 0;
}

message Value {
  oneof kind {
    NullValue null_value = 1;
    double number_value = 2;
    string string_value = 3;
    bool bool_value = 4;
    Struct struct_value = 5;
    ListValue list_value = 6;
  }
}

message Struct {
  map<string, Value> fields = 1;
}

message ListValue {
  repeated Value values = 1;
}
